[tool.pytest.ini_options]
asyncio_mode = "strict"
timeout = 60
markers = [
    "unit: pure logic, no external IO (default for unmarked tests once the marker sweep lands)",
    "db: requires a real Postgres reachable via DATABASE_URL — uses build_postgres_session_factory or hits the live engine",
    "slow: wall-clock > 5 s under normal load; safe to skip for fast pre-commit feedback",
]

[tool.ruff]
target-version = "py312"
line-length = 120
extend-exclude = [
    "venv",
    ".venv",
    "alembic/versions",
    "data",
]

[tool.ruff.lint]
# Keep in lockstep with CI (`ruff check .`): pycodestyle E4/E7/E9 + pyflakes.
# Broader rule sets (I/UP/B/SIM/RUF) are intentional future tightenings —
# enable once the tree is cleaned, not in the same PR as pre-commit bootstrapping.
select = [
    "E4",
    "E7",
    "E9",
    "F",
]
ignore = [
    "E501",  # line length enforced by the formatter
]

[tool.ruff.lint.per-file-ignores]
"api/websocket.py" = ["E402"]
"**/api/websocket.py" = ["E402"]
"tests/*.py" = ["E402"]
"tests/**/*.py" = ["E402"]
"**/tests/*.py" = ["E402"]
"**/tests/**/*.py" = ["E402"]
"workers/*.py" = ["E402"]
"workers/**/*.py" = ["E402"]
"**/workers/*.py" = ["E402"]
"**/workers/**/*.py" = ["E402"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
